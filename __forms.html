<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Form registration</title></head>
  <body>
    <form name="quotation-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quotation-request" />
      <input name="name" />
      <input name="company" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="product" />
      <input name="quantity" />
      <input name="delivery-location" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="dispatch-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="dispatch-inquiry" />
      <input name="name" />
      <input name="phone" type="tel" />
      <input name="product" />
      <input name="quantity" />
      <input name="site-address" />
      <input name="dispatch-date" />
      <input name="vehicle" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
